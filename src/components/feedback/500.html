<!--
  UI Framework — 500 Error Page
-->

<div class="min-h-screen flex flex-col items-center justify-center px-4 py-16 bg-background text-center">
  <p class="text-base font-semibold text-danger-600">500</p>
  <h1 class="mt-3 text-4xl font-bold tracking-tight text-default sm:text-5xl">Server error</h1>
  <p class="mt-4 text-lg text-muted max-w-md">
    Something went wrong on our end. Please try again in a moment, or contact support if the problem continues.
  </p>
  <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
    <a href="/" class="inline-flex items-center justify-center rounded-lg bg-primary-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-primary-700 transition">
      Go back home
    </a>
    <a href="#" class="inline-flex items-center justify-center rounded-lg border border-default bg-surface px-5 py-2.5 text-sm font-semibold text-default hover:bg-surface-muted transition">
      Contact support
    </a>
  </div>
</div>

<!--
  UI Framework — Modal
  Usage: Add data-modal-open="modal-id" on trigger button.
-->

<!-- Trigger -->
<button type="button" data-modal-open="demo-modal"
  class="inline-flex items-center rounded-lg bg-primary-600 px-4 py-2 text-sm font-medium text-white hover:bg-primary-700">
  Open Modal
</button>

<!-- Modal -->
<div id="demo-modal" class="fixed inset-0 z-modal hidden" role="dialog" aria-modal="true" aria-labelledby="demo-modal-title" aria-hidden="true">
  <!-- Backdrop -->
  <div data-modal-backdrop class="absolute inset-0 bg-secondary-900/60 opacity-0 transition-opacity duration-200"></div>

  <!-- Panel -->
  <div class="absolute inset-0 flex items-center justify-center p-4">
    <div data-modal-panel
      class="relative w-full max-w-lg rounded-xl border border-default bg-surface shadow-xl opacity-0 scale-95 transition-all duration-200">
      <!-- Header -->
      <div class="flex items-center justify-between border-b border-default px-6 py-4">
        <h2 id="demo-modal-title" class="text-lg font-semibold text-default">Modal Title</h2>
        <button type="button" data-modal-close class="rounded-lg p-1.5 text-muted hover:bg-surface-muted hover:text-default" aria-label="Close">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Body -->
      <div class="px-6 py-5">
        <p class="text-sm text-muted">
          This is a fully accessible modal dialog. It traps focus, closes on Escape or backdrop click, and restores focus to the trigger when closed.
        </p>
      </div>

      <!-- Footer -->
      <div class="flex justify-end gap-3 border-t border-default px-6 py-4">
        <button type="button" data-modal-close
          class="inline-flex items-center rounded-lg border border-default bg-surface px-4 py-2 text-sm font-medium text-default hover:bg-surface-muted">
          Cancel
        </button>
        <button type="button"
          class="inline-flex items-center rounded-lg bg-primary-600 px-4 py-2 text-sm font-medium text-white hover:bg-primary-700">
          Confirm
        </button>
      </div>
    </div>
  </div>
</div>

<!--
  UI Framework — Dropdown Menu
-->

<div data-dropdown class="relative inline-block text-left">
  <button type="button" data-dropdown-toggle aria-expanded="false" aria-haspopup="menu"
    class="inline-flex items-center gap-2 rounded-lg border border-default bg-surface px-4 py-2 text-sm font-medium text-default shadow-sm hover:bg-surface-muted">
    Options
    <svg class="h-4 w-4 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
    </svg>
  </button>

  <div data-dropdown-menu role="menu" aria-hidden="true"
    class="absolute right-0 z-dropdown mt-2 w-56 origin-top-right rounded-lg border border-default bg-surface py-1 shadow-lg hidden">
    <a href="#" role="menuitem" class="block px-4 py-2 text-sm text-default hover:bg-surface-muted focus:bg-surface-muted focus:outline-none">Edit</a>
    <a href="#" role="menuitem" class="block px-4 py-2 text-sm text-default hover:bg-surface-muted focus:bg-surface-muted focus:outline-none">Duplicate</a>
    <a href="#" role="menuitem" class="block px-4 py-2 text-sm text-default hover:bg-surface-muted focus:bg-surface-muted focus:outline-none">Archive</a>
    <div class="my-1 border-t border-default"></div>
    <a href="#" role="menuitem" class="block px-4 py-2 text-sm text-danger-600 hover:bg-danger-50 dark:hover:bg-danger-950 focus:outline-none">Delete</a>
  </div>
</div>

<!--
  UI Framework — Badge / Tag / Chip
-->

<!-- ==================== SOLID BADGES ==================== -->
<span class="inline-flex items-center rounded-full bg-primary-600 px-2.5 py-0.5 text-xs font-medium text-white">Primary</span>
<span class="inline-flex items-center rounded-full bg-secondary-600 px-2.5 py-0.5 text-xs font-medium text-white">Secondary</span>
<span class="inline-flex items-center rounded-full bg-success-600 px-2.5 py-0.5 text-xs font-medium text-white">Success</span>
<span class="inline-flex items-center rounded-full bg-danger-600 px-2.5 py-0.5 text-xs font-medium text-white">Danger</span>
<span class="inline-flex items-center rounded-full bg-warning-500 px-2.5 py-0.5 text-xs font-medium text-white">Warning</span>
<span class="inline-flex items-center rounded-full bg-info-600 px-2.5 py-0.5 text-xs font-medium text-white">Info</span>

<!-- ==================== SOFT BADGES ==================== -->
<span class="inline-flex items-center rounded-full bg-primary-50 px-2.5 py-0.5 text-xs font-medium text-primary-700 dark:bg-primary-950 dark:text-primary-300">Primary</span>
<span class="inline-flex items-center rounded-full bg-success-50 px-2.5 py-0.5 text-xs font-medium text-success-700 dark:bg-success-950 dark:text-success-300">Success</span>
<span class="inline-flex items-center rounded-full bg-danger-50 px-2.5 py-0.5 text-xs font-medium text-danger-700 dark:bg-danger-950 dark:text-danger-300">Danger</span>
<span class="inline-flex items-center rounded-full bg-warning-50 px-2.5 py-0.5 text-xs font-medium text-warning-700 dark:bg-warning-950 dark:text-warning-300">Warning</span>
<span class="inline-flex items-center rounded-full bg-info-50 px-2.5 py-0.5 text-xs font-medium text-info-700 dark:bg-info-950 dark:text-info-300">Info</span>

<!-- ==================== OUTLINE BADGES ==================== -->
<span class="inline-flex items-center rounded-full border border-primary-300 bg-transparent px-2.5 py-0.5 text-xs font-medium text-primary-700 dark:border-primary-700 dark:text-primary-300">Primary</span>
<span class="inline-flex items-center rounded-full border border-success-300 bg-transparent px-2.5 py-0.5 text-xs font-medium text-success-700 dark:border-success-700 dark:text-success-300">Success</span>

<!-- ==================== WITH DOT ==================== -->
<span class="inline-flex items-center gap-1.5 rounded-full bg-success-50 px-2.5 py-0.5 text-xs font-medium text-success-700 dark:bg-success-950 dark:text-success-300">
  <span class="h-1.5 w-1.5 rounded-full bg-success-500"></span>
  Online
</span>
<span class="inline-flex items-center gap-1.5 rounded-full bg-danger-50 px-2.5 py-0.5 text-xs font-medium text-danger-700 dark:bg-danger-950 dark:text-danger-300">
  <span class="h-1.5 w-1.5 rounded-full bg-danger-500"></span>
  Offline
</span>
<span class="inline-flex items-center gap-1.5 rounded-full bg-warning-50 px-2.5 py-0.5 text-xs font-medium text-warning-700 dark:bg-warning-950 dark:text-warning-300">
  <span class="h-1.5 w-1.5 rounded-full bg-warning-500"></span>
  Away
</span>

<!-- ==================== WITH REMOVE ==================== -->
<span class="inline-flex items-center gap-1 rounded-full bg-secondary-100 px-2.5 py-0.5 text-xs font-medium text-secondary-800 dark:bg-secondary-800 dark:text-secondary-200">
  Design
  <button type="button" class="ml-0.5 inline-flex h-4 w-4 items-center justify-center rounded-full hover:bg-secondary-200 dark:hover:bg-secondary-700" aria-label="Remove">
    <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
  </button>
</span>

<!-- ==================== SIZES ==================== -->
<span class="inline-flex items-center rounded-full bg-primary-600 px-2 py-0.5 text-[10px] font-medium text-white">XS</span>
<span class="inline-flex items-center rounded-full bg-primary-600 px-2.5 py-0.5 text-xs font-medium text-white">SM</span>
<span class="inline-flex items-center rounded-full bg-primary-600 px-3 py-1 text-sm font-medium text-white">MD</span>

<!--
  UI Framework — Basic Responsive Header
  Includes: Logo, Desktop Nav, CTA, Mobile Hamburger + Drawer
-->

<header class="sticky top-0 z-sticky border-b border-default bg-surface/95 backdrop-blur supports-[backdrop-filter]:bg-surface/80">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between gap-4">
      <!-- Logo -->
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-2 font-semibold text-default">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary-600 text-white text-sm font-bold">UI</span>
          <span class="hidden sm:inline">Framework</span>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex items-center gap-1" aria-label="Main">
        <a href="#" class="rounded-lg px-3 py-2 text-sm font-medium text-muted hover:bg-surface-muted hover:text-default transition">Home</a>
        <a href="#" class="rounded-lg px-3 py-2 text-sm font-medium text-muted hover:bg-surface-muted hover:text-default transition">Features</a>
        <a href="#" class="rounded-lg px-3 py-2 text-sm font-medium text-muted hover:bg-surface-muted hover:text-default transition">Pricing</a>
        <a href="#" class="rounded-lg px-3 py-2 text-sm font-medium text-muted hover:bg-surface-muted hover:text-default transition">Docs</a>
        <a href="#" class="rounded-lg px-3 py-2 text-sm font-medium text-muted hover:bg-surface-muted hover:text-default transition">Blog</a>
      </nav>

      <!-- Desktop CTA + Theme -->
      <div class="hidden md:flex items-center gap-3">
        <button type="button" id="themeToggleDesktop" class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-muted hover:bg-surface-muted hover:text-default" aria-label="Toggle theme">
          <svg class="h-5 w-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>
          <svg class="hidden h-5 w-5 dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>
        </button>
        <a href="#" class="text-sm font-medium text-muted hover:text-default">Sign in</a>
        <a href="#" class="inline-flex items-center rounded-lg bg-primary-600 px-3.5 py-2 text-sm font-medium text-white shadow-sm hover:bg-primary-700 transition">Get started</a>
      </div>

      <!-- Mobile menu button -->
      <button type="button" class="md:hidden inline-flex h-10 w-10 items-center justify-center rounded-lg text-muted hover:bg-surface-muted" aria-label="Open menu" aria-expanded="false" data-mobile-menu-toggle>
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer -->
  <div class="md:hidden hidden" data-mobile-menu role="dialog" aria-modal="true" aria-label="Mobile navigation">
    <div class="border-t border-default bg-surface px-4 py-4 space-y-1">
      <a href="#" class="block rounded-lg px-3 py-2.5 text-base font-medium text-default hover:bg-surface-muted">Home</a>
      <a href="#" class="block rounded-lg px-3 py-2.5 text-base font-medium text-default hover:bg-surface-muted">Features</a>
      <a href="#" class="block rounded-lg px-3 py-2.5 text-base font-medium text-default hover:bg-surface-muted">Pricing</a>
      <a href="#" class="block rounded-lg px-3 py-2.5 text-base font-medium text-default hover:bg-surface-muted">Docs</a>
      <a href="#" class="block rounded-lg px-3 py-2.5 text-base font-medium text-default hover:bg-surface-muted">Blog</a>
      <div class="pt-4 mt-4 border-t border-default space-y-2">
        <a href="#" class="block rounded-lg px-3 py-2.5 text-base font-medium text-default hover:bg-surface-muted">Sign in</a>
        <a href="#" class="block rounded-lg bg-primary-600 px-3 py-2.5 text-center text-base font-medium text-white hover:bg-primary-700">Get started</a>
      </div>
    </div>
  </div>
</header>

<!--
  UI Framework — Product Grid Section
-->

<section class="bg-background py-12 sm:py-16">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-8">
      <div>
        <h2 class="text-2xl font-bold tracking-tight text-default sm:text-3xl">Featured products</h2>
        <p class="mt-1 text-sm text-muted">Hand-picked items just for you</p>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <select class="rounded-lg border border-default bg-surface px-3 py-2 text-sm text-default focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20">
          <option>Sort by: Popular</option>
          <option>Price: Low to High</option>
          <option>Price: High to Low</option>
          <option>Newest</option>
        </select>
        <a href="#" class="text-sm font-semibold text-primary-600 hover:text-primary-500">View all →</a>
      </div>
    </div>

    <!-- Grid -->
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      <!-- Product 1 -->
      <div class="group relative flex flex-col overflow-hidden rounded-2xl border border-default bg-surface shadow-sm hover:shadow-md transition">
        <span class="absolute left-3 top-3 z-10 rounded-full bg-danger-600 px-2 py-0.5 text-xs font-semibold text-white">Sale</span>
        <a href="#" class="aspect-square overflow-hidden bg-surface-muted">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=400&fit=crop" alt="" class="h-full w-full object-cover group-hover:scale-105 transition duration-300">
        </a>
        <div class="flex flex-1 flex-col p-4">
          <p class="text-xs text-muted">Accessories</p>
          <h3 class="mt-1 text-sm font-semibold text-default"><a href="#" class="hover:text-primary-600">Classic Watch</a></h3>
          <div class="mt-2 flex items-baseline gap-2">
            <span class="font-bold text-default">$129</span>
            <span class="text-sm text-muted line-through">$159</span>
          </div>
          <button type="button" class="mt-3 w-full rounded-lg bg-primary-600 py-2 text-sm font-medium text-white hover:bg-primary-700">Add to cart</button>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="group relative flex flex-col overflow-hidden rounded-2xl border border-default bg-surface shadow-sm hover:shadow-md transition">
        <a href="#" class="aspect-square overflow-hidden bg-surface-muted">
          <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400&h=400&fit=crop" alt="" class="h-full w-full object-cover group-hover:scale-105 transition duration-300">
        </a>
        <div class="flex flex-1 flex-col p-4">
          <p class="text-xs text-muted">Eyewear</p>
          <h3 class="mt-1 text-sm font-semibold text-default"><a href="#" class="hover:text-primary-600">Sunglasses Pro</a></h3>
          <div class="mt-2 flex items-baseline gap-2">
            <span class="font-bold text-default">$89</span>
          </div>
          <button type="button" class="mt-3 w-full rounded-lg bg-primary-600 py-2 text-sm font-medium text-white hover:bg-primary-700">Add to cart</button>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="group relative flex flex-col overflow-hidden rounded-2xl border border-default bg-surface shadow-sm hover:shadow-md transition">
        <span class="absolute left-3 top-3 z-10 rounded-full bg-success-600 px-2 py-0.5 text-xs font-semibold text-white">New</span>
        <a href="#" class="aspect-square overflow-hidden bg-surface-muted">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&h=400&fit=crop" alt="" class="h-full w-full object-cover group-hover:scale-105 transition duration-300">
        </a>
        <div class="flex flex-1 flex-col p-4">
          <p class="text-xs text-muted">Audio</p>
          <h3 class="mt-1 text-sm font-semibold text-default"><a href="#" class="hover:text-primary-600">Wireless Headphones</a></h3>
          <div class="mt-2 flex items-baseline gap-2">
            <span class="font-bold text-default">$199</span>
          </div>
          <button type="button" class="mt-3 w-full rounded-lg bg-primary-600 py-2 text-sm font-medium text-white hover:bg-primary-700">Add to cart</button>
        </div>
      </div>

      <!-- Product 4 -->
      <div class="group relative flex flex-col overflow-hidden rounded-2xl border border-default bg-surface shadow-sm hover:shadow-md transition">
        <a href="#" class="aspect-square overflow-hidden bg-surface-muted">
          <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=400&fit=crop" alt="" class="h-full w-full object-cover group-hover:scale-105 transition duration-300">
        </a>
        <div class="flex flex-1 flex-col p-4">
          <p class="text-xs text-muted">Footwear</p>
          <h3 class="mt-1 text-sm font-semibold text-default"><a href="#" class="hover:text-primary-600">Running Sneakers</a></h3>
          <div class="mt-2 flex items-baseline gap-2">
            <span class="font-bold text-default">$149</span>
          </div>
          <button type="button" class="mt-3 w-full rounded-lg bg-primary-600 py-2 text-sm font-medium text-white hover:bg-primary-700">Add to cart</button>
        </div>
      </div>
    </div>
  </div>
</section>

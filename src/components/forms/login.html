<!--
  UI Framework — Login Page / Form
-->

<div class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-background">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-primary-600 text-lg font-bold text-white">UI</span>
    </div>
    <h2 class="mt-6 text-center text-2xl font-bold tracking-tight text-default">Sign in to your account</h2>
    <p class="mt-2 text-center text-sm text-muted">
      Or
      <a href="#" class="font-medium text-primary-600 hover:text-primary-500">create a new account</a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-surface px-6 py-8 shadow-sm sm:rounded-xl border border-default sm:px-10">
      <form class="space-y-6" action="#" method="POST">
        <div>
          <label for="email" class="block text-sm font-medium text-default">Email address</label>
          <div class="mt-1.5">
            <input id="email" name="email" type="email" autocomplete="email" required
              class="block w-full rounded-lg border border-default bg-surface px-3.5 py-2.5 text-sm shadow-sm placeholder:text-subtle focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-default">Password</label>
          <div class="mt-1.5 relative">
            <input id="password" name="password" type="password" autocomplete="current-password" required data-password-input
              class="block w-full rounded-lg border border-default bg-surface px-3.5 py-2.5 pr-11 text-sm shadow-sm placeholder:text-subtle focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20">
            <button type="button" data-password-toggle class="absolute inset-y-0 right-0 flex items-center pr-3 text-subtle hover:text-muted" aria-label="Show password">
              <svg class="h-5 w-5" data-icon-show fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <svg class="hidden h-5 w-5" data-icon-hide fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2">
            <input type="checkbox" name="remember" class="h-4 w-4 rounded border-default text-primary-600 focus:ring-primary-500/30">
            <span class="text-sm text-default">Remember me</span>
          </label>
          <a href="#" class="text-sm font-medium text-primary-600 hover:text-primary-500">Forgot password?</a>
        </div>

        <div>
          <button type="submit" class="flex w-full justify-center rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-primary-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500 transition">
            Sign in
          </button>
        </div>
      </form>

      <div class="mt-6">
        <div class="relative">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-default"></div></div>
          <div class="relative flex justify-center text-sm"><span class="bg-surface px-3 text-muted">Or continue with</span></div>
        </div>
        <div class="mt-6 grid grid-cols-2 gap-3">
          <a href="#" class="inline-flex w-full items-center justify-center gap-2 rounded-lg border border-default bg-surface px-4 py-2.5 text-sm font-medium text-default hover:bg-surface-muted transition">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
            Google
          </a>
          <a href="#" class="inline-flex w-full items-center justify-center gap-2 rounded-lg border border-default bg-surface px-4 py-2.5 text-sm font-medium text-default hover:bg-surface-muted transition">
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"/></svg>
            GitHub
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

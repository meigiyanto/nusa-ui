<!--
  UI Framework — Forgot Password Page
-->

<div class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-background">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-primary-600 text-lg font-bold text-white">UI</span>
    </div>
    <h2 class="mt-6 text-center text-2xl font-bold tracking-tight text-default">Reset your password</h2>
    <p class="mt-2 text-center text-sm text-muted">
      Enter your email and we’ll send you a reset link.
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-surface px-6 py-8 shadow-sm sm:rounded-xl border border-default sm:px-10">
      <form class="space-y-5" action="#" method="POST">
        <div>
          <label for="reset-email" class="block text-sm font-medium text-default">Email address</label>
          <input id="reset-email" name="email" type="email" autocomplete="email" required
            class="mt-1.5 block w-full rounded-lg border border-default bg-surface px-3.5 py-2.5 text-sm shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20">
        </div>
        <button type="submit" class="flex w-full justify-center rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-primary-700 transition">
          Send reset link
        </button>
      </form>
      <p class="mt-6 text-center text-sm text-muted">
        <a href="#" class="font-medium text-primary-600 hover:text-primary-500">← Back to sign in</a>
      </p>
    </div>
  </div>
</div>

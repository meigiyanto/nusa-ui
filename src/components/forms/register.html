<!--
  UI Framework — Register Page
-->

<div class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-background">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-primary-600 text-lg font-bold text-white">UI</span>
    </div>
    <h2 class="mt-6 text-center text-2xl font-bold tracking-tight text-default">Create your account</h2>
    <p class="mt-2 text-center text-sm text-muted">
      Already have an account?
      <a href="#" class="font-medium text-primary-600 hover:text-primary-500">Sign in</a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-surface px-6 py-8 shadow-sm sm:rounded-xl border border-default sm:px-10">
      <form class="space-y-5" action="#" method="POST">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="first-name" class="block text-sm font-medium text-default">First name</label>
            <input id="first-name" name="first-name" type="text" required class="mt-1.5 block w-full rounded-lg border border-default bg-surface px-3.5 py-2.5 text-sm shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20">
          </div>
          <div>
            <label for="last-name" class="block text-sm font-medium text-default">Last name</label>
            <input id="last-name" name="last-name" type="text" required class="mt-1.5 block w-full rounded-lg border border-default bg-surface px-3.5 py-2.5 text-sm shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20">
          </div>
        </div>
        <div>
          <label for="reg-email" class="block text-sm font-medium text-default">Email</label>
          <input id="reg-email" name="email" type="email" autocomplete="email" required class="mt-1.5 block w-full rounded-lg border border-default bg-surface px-3.5 py-2.5 text-sm shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20">
        </div>
        <div>
          <label for="reg-password" class="block text-sm font-medium text-default">Password</label>
          <input id="reg-password" name="password" type="password" required class="mt-1.5 block w-full rounded-lg border border-default bg-surface px-3.5 py-2.5 text-sm shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20">
          <p class="mt-1 text-xs text-subtle">At least 8 characters</p>
        </div>
        <div>
          <label for="reg-confirm" class="block text-sm font-medium text-default">Confirm password</label>
          <input id="reg-confirm" name="confirm" type="password" required class="mt-1.5 block w-full rounded-lg border border-default bg-surface px-3.5 py-2.5 text-sm shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20">
        </div>
        <label class="flex items-start gap-3">
          <input type="checkbox" name="terms" required class="mt-0.5 h-4 w-4 rounded border-default text-primary-600 focus:ring-primary-500/30">
          <span class="text-sm text-default">I agree to the <a href="#" class="font-medium text-primary-600 hover:text-primary-500">Terms</a> and <a href="#" class="font-medium text-primary-600 hover:text-primary-500">Privacy Policy</a>.</span>
        </label>
        <button type="submit" class="flex w-full justify-center rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-primary-700 transition">
          Create account
        </button>
      </form>
    </div>
  </div>
</div>

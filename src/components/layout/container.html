<!--
  UI Framework — Layout Helpers
-->

<!-- ==================== CONTAINER ==================== -->
<!-- Use .container-fw (from components.css) or Tailwind container -->
<div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-7xl">
  <!-- Content constrained to max width -->
</div>

<!-- Fluid container -->
<div class="w-full px-4 sm:px-6 lg:px-8">
  <!-- Full width with padding -->
</div>

<!-- ==================== SECTION ==================== -->
<section class="py-12 md:py-16 lg:py-20">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Section content -->
  </div>
</section>

<!-- ==================== STACK ==================== -->
<div class="space-y-4"> <!-- or .stack -->
  <div>Item 1</div>
  <div>Item 2</div>
  <div>Item 3</div>
</div>

<!-- ==================== GRID ==================== -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
  <div class="rounded-xl border border-default bg-surface p-6">Column 1</div>
  <div class="rounded-xl border border-default bg-surface p-6">Column 2</div>
  <div class="rounded-xl border border-default bg-surface p-6">Column 3</div>
</div>

<!-- ==================== TWO COLUMN ==================== -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 items-center">
  <div>
    <h2 class="text-2xl font-bold text-default">Left content</h2>
    <p class="mt-3 text-muted">Supporting text goes here.</p>
  </div>
  <div class="rounded-xl bg-surface-muted aspect-video flex items-center justify-center text-muted">
    Media / Illustration
  </div>
</div>

<!-- ==================== SIDEBAR LAYOUT ==================== -->
<div class="flex flex-col lg:flex-row gap-8">
  <aside class="w-full lg:w-64 shrink-0">
    <nav class="sticky top-6 space-y-1">
      <!-- Sidebar nav items -->
    </nav>
  </aside>
  <main class="flex-1 min-w-0">
    <!-- Main content -->
  </main>
</div>

<!-- ==================== DIVIDER ==================== -->
<div class="relative my-8">
  <div class="absolute inset-0 flex items-center" aria-hidden="true">
    <div class="w-full border-t border-default"></div>
  </div>
  <div class="relative flex justify-center">
    <span class="bg-background px-3 text-sm text-muted">Or continue with</span>
  </div>
</div>

<!-- Simple divider -->
<hr class="border-default my-8">

<!-- ==================== ASPECT RATIO ==================== -->
<div class="aspect-video rounded-xl bg-surface-muted overflow-hidden">
  <!-- 16:9 content -->
</div>
<div class="aspect-square rounded-xl bg-surface-muted overflow-hidden">
  <!-- 1:1 content -->
</div>
